services:
  dashboard:
    # Prebuilt multi-arch image (amd64/arm64) from GitHub Actions. Pin a version in .env
    # (DASHBOARD_VERSION=1.0.0) for predictable updates. Local build: see docker-compose.build.yml
    image: ghcr.io/phillipunzen/proxmox-dashboard:${DASHBOARD_VERSION:-latest}
    container_name: proxmox-dashboard
    restart: unless-stopped
    env_file: .env
    environment:
      VM_URL: ${VM_URL:-http://victoriametrics:8428}
    ports:
      - "${DASHBOARD_PORT:-8080}:8000"
    volumes:
      # Users, sessions, audit log (SQLite) and the generated secret key
      - app-data:/data
      # Optional: CA certificate of your Proxmox cluster (PVE_n_CA_FILE=/certs/pve-root-ca.pem)
      - ./certs:/certs:ro
    depends_on:
      - victoriametrics
    # Hardening: nothing in the container needs to write outside /tmp or gain privileges.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.153.0
    container_name: proxmox-dashboard-vm
    restart: unless-stopped
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=${VM_RETENTION:-400d}
      # Only the dashboard writes; no need for the other ingestion protocols.
      - -httpListenAddr=:8428
    volumes:
      - vm-data:/storage
    # Not published: only reachable from the dashboard container.
    # Uncomment for Grafana or debugging:
    # ports:
    #   - "127.0.0.1:8428:8428"
    logging: *logging

  # Optional MCP server for AI assistants:  docker compose --profile mcp up -d
  mcp:
    image: ghcr.io/phillipunzen/proxmox-dashboard-mcp:${DASHBOARD_VERSION:-latest}
    container_name: proxmox-dashboard-mcp
    profiles: ["mcp"]
    restart: unless-stopped
    environment:
      DASHBOARD_URL: http://dashboard:8000
      DASHBOARD_API_KEY: ${MCP_DASHBOARD_API_KEY:-}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
      MCP_TRANSPORT: http
    ports:
      - "${MCP_PORT:-8765}:8765"
    depends_on:
      - dashboard
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *logging

volumes:
  app-data:
  vm-data:
